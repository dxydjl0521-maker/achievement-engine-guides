name: Publish validated guide
on:
  push:
    branches: [main]
    paths:
      - 'submissions/*.json'
  workflow_dispatch:
    inputs:
      submissionId:
        description: '需重试发布的投稿 ID'
        required: true
        type: string
      recoveryReason:
        description: '单次指定投稿的仓库所有者补发理由；其他投稿无效'
        required: false
        type: string
permissions:
  actions: read
  contents: write
  pull-requests: read
jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revalidate asset and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_BEFORE: ${{ github.event.before }}
          SUBMISSION_ID: ${{ inputs.submissionId }}
          RECOVERY_REASON: ${{ inputs.recoveryReason }}
          WORKFLOW_ACTOR: ${{ github.actor }}
          WORKFLOW_EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          APP_VERSION: ${{ vars.GUIDE_APP_VERSION }}
          GUIDE_MAINTAINERS: ${{ vars.GUIDE_MAINTAINERS }}
        run: node scripts/publish-submission.mjs
